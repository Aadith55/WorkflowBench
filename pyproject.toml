[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowbench"
version = "0.1.0"
description = "A learnable research prototype for AI workflow orchestration and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0.0", "pydantic>=2.8.0", "streamlit>=1.40.0", "pandas>=2.2.0", "python-dotenv>=1.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[project.scripts]
workflowbench = "workflowbench.cli:main"

[tool.setuptools.packages.find]
include = ["workflowbench*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
